# 放到 /www/server/panel/vhost/nginx/extension/jstai.com.cn/jst-meeting-redirect.conf
# （80 端口的 jstai.com.cn.conf 里需有 include /www/server/panel/vhost/nginx/extension/jstai.com.cn/*.conf;）
# 只把 /jst-meeting/ 的 HTTP 请求跳到 HTTPS，主站其他路径不变。
location ^~ /jst-meeting/ {
    return 301 https://$host$request_uri;
}
location = /jst-meeting {
    return 301 https://$host/jst-meeting/;
}
