# 宝塔 nginx：jstai.com.cn 的 HTTPS 站点，/jst-meeting/ 转发给本机 gunicorn。
# 放到 /www/server/panel/vhost/nginx/jst-meeting.conf（宝塔会自动 include 该目录下的 *.conf）。
# 其余路径转回 80 端口的 http 站点（它的前端调用 http 接口，放在 https 下会被浏览器拦截）。
server {
    listen 443 ssl http2;
    server_name jstai.com.cn;
    root /www/wwwroot/jstai.com.cn;

    ssl_certificate     /etc/letsencrypt/live/jstai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jstai.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jstmeeting:2m;
    ssl_session_timeout 1h;
    # 站点其余部分仍是 http（前端写死了 http 接口地址），不能让浏览器记住"只走 https"。
    add_header Strict-Transport-Security "max-age=0" always;

    location = /jst-meeting { return 308 /jst-meeting/$is_args$args; }
    location ^~ /jst-meeting/ {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:18899/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /jst-meeting;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Port '';
        proxy_set_header Forwarded '';
        proxy_redirect off;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 除 /jst-meeting/ 外的页面是 http 站点：https 访问时转回 http，避免浏览器拦截它对 http 接口的请求。
    location / {
        return 302 http://$host$request_uri;
    }
    access_log /www/wwwlogs/jstai.com.cn.log;
    error_log  /www/wwwlogs/jstai.com.cn.error.log;
}
