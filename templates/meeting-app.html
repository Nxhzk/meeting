<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>{{ title|default('捷士通智能会议') }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/jst/mark.png') }}">
    {% for stylesheet in styles|default([]) %}
    <link rel="stylesheet" href="{{ stylesheet }}">
    {% endfor %}
    {% if script %}
    <script type="module" src="{{ script }}"></script>
    {% endif %}
</head>
<body>
    {% if unavailable %}
    <main><h1>会议页面暂不可用</h1><p>前端资源尚未部署，请稍后重试。</p></main>
    {% else %}
    <div id="root">
        {# 页面脚本下载完之前先显示加载动画（样式已在上面加载），React 渲染时会替换掉这里 #}
        <div class="boot-splash" role="status" aria-label="正在加载">
            <span class="jst-loader" data-tone="brand" style="width:56px;height:56px">
                <svg viewBox="0 0 106 104" width="56" height="56"><g class="jst-loader-body">
                    <path class="jst-loader-piece blue" pathLength="100" d="M30 64 V24 L53 11 L74 23" />
                    <path class="jst-loader-piece red" pathLength="100" d="M76 40 V80 L53 93 L32 81" />
                    <g class="jst-loader-dots"><circle cx="86" cy="32" r="3.4" /><circle cx="93" cy="25" r="2.5" /><circle cx="99" cy="19" r="1.8" /></g>
                </g></svg>
            </span>
            <span class="boot-splash-text">正在加载</span>
        </div>
    </div>
    <script id="meeting-bootstrap" type="application/json">{{ bootstrap|tojson }}</script>
    <noscript>请开启 JavaScript 后使用捷士通智能会议。</noscript>
    {% endif %}
</body>
</html>
